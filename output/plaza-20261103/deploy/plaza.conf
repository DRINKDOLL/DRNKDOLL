# 警院成果展示广场 —— Nginx 站点配置
# 80 → Halo(127.0.0.1:8092)；/api/manage/ → 成果管理代理(127.0.0.1:8093，需登录)

# Halo 控制台 SPA 使用 WebSocket，需要按 Upgrade 头动态决定 Connection
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 外部请求携带的 HTTP Basic 凭据一律剥掉。
# 原因：Halo 内部要为「成果管理代理」启用 Basic（代理在回环内直连 8092），
# 但绝不允许公网用账号密码直接调管理接口；浏览器登录后台走的是 Cookie 会话，不受影响。
map $http_authorization $plaza_auth {
    default       $http_authorization;
    "~*^Basic "   "";
}

server {
    # 作为 80 端口的默认虚拟主机，直接覆盖系统自带的欢迎页
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.138.34.151 _;

    # Halo 后台支持附件上传，放宽到 50M
    client_max_body_size 50m;

    access_log /var/log/nginx/plaza.access.log;
    error_log  /var/log/nginx/plaza.error.log;

    # ---------- 成果管理代理（编辑 / 删除）----------
    location /api/manage/ {
        # 门禁：只有已登录 Halo 后台的会话才能调用
        auth_request /_manage_authz;

        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    # 内部鉴权子请求：拿浏览器的 Halo 会话 Cookie 问一次控制台接口。
    # 未登录会被 302 到登录页 → 统一改判为 401，从而拒绝 /api/manage/。
    location = /_manage_authz {
        internal;
        proxy_pass http://127.0.0.1:8092/apis/api.console.halo.run/v1alpha1/posts?page=0&size=1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host   $host;
        proxy_set_header Cookie $http_cookie;
        proxy_intercept_errors on;
        error_page 301 302 303 401 403 = @manage_deny;
    }

    location @manage_deny {
        default_type application/json;
        return 401 '{"error":"需要先登录 Halo 后台（/console）才能管理成果"}';
    }

    # ---------- 统一身份登录 BFF（论坛账号确认 → Halo 本地用户映射）----------
    # 只转发这一个端点；BFF 本身绑回环，公网不直接暴露 8095 端口。
    # 登录页在 80/443 访问时走同源路径，因此无需额外开放端口或改安全组。
    location = /api/unified-login {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 保留浏览器 Origin，供 BFF 做来源校验（防盗用登录端点）
        proxy_set_header Origin            $http_origin;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ---------- 广场网关接口（IF-08：只读、需 AppKey + HMAC 签名）----------
    # 路由白名单与限流在网关服务内部实现，这里只做转发。
    location /api/v1/internal/ {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------- 用户态接口（/api/v1/user/：网关注入身份头后校验）----------
    # 与 internal 同源，同一网关进程（8094）承载，但鉴权模型不同：
    # 由网关在转发时注入 X-User-Id / X-Token-Exp / X-Internal-Sign 等身份头，
    # 广场侧校验内部签名（失败 403/40303）、令牌时效（过期 401/40103）、水平越权（403/70002）。
    location /api/v1/user/ {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------- 站点主体 ----------
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 剥掉外部 Basic（Bearer 等其它方案原样透传）
        proxy_set_header Authorization     $plaza_auth;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # 后台长轮询场景不要缓冲
        proxy_buffering off;
    }
}
