# Halo 控制台 SPA 使用 WebSocket，需要按 Upgrade 头动态决定 Connection
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # 作为 80 端口的默认虚拟主机，直接覆盖系统自带的欢迎页
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.138.34.151 _;

    # Halo 后台支持附件上传，放宽到 50M
    client_max_body_size 50m;

    access_log /var/log/nginx/plaza.access.log;
    error_log  /var/log/nginx/plaza.error.log;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # 后台长轮询场景不要缓冲
        proxy_buffering off;
    }
}
