<!doctype html>
<html th:lang="${#locale.toLanguageTag}">
  <head>
    <meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2" />
<meta name="generator" content="警院成果展示广场" />
<link th:unless="${#strings.isEmpty(site.logo)}" rel="preload" th:href="${site.logo}" as="image" />
<script th:inline="javascript">
  window.i18nResources = {
    "jsModule.colorSchemeSwitcher.dark": `[(#{jsModule.colorSchemeSwitcher.dark})]`,
    "jsModule.colorSchemeSwitcher.light": `[(#{jsModule.colorSchemeSwitcher.light})]`,
    "jsModule.colorSchemeSwitcher.auto": `[(#{jsModule.colorSchemeSwitcher.auto})]`,
    "jsModule.share.qzone": `[(#{jsModule.share.qzone})]`,
    "jsModule.share.weibo": `[(#{jsModule.share.weibo})]`,
    "jsModule.share.douban": `[(#{jsModule.share.douban})]`,
    "jsModule.share.wechat": `[(#{jsModule.share.wechat})]`,
    "jsModule.share.native": `[(#{jsModule.share.native})]`,
    "jsModule.share.windowTitle": `[(#{jsModule.share.windowTitle})]`,
    "jsModule.upvote.networkError": `[(#{jsModule.upvote.networkError})]`,
  };
  var colorScheme = /*[[${theme.config.style.color_scheme}]]*/ "system";
  var enableChangeColorScheme = /*[[${theme.config.style.enable_change_color_scheme}]]*/ false;
</script>
<noscript>
  <style>
    body {
      display: block !important;
    }
  </style>
</noscript>


    
    <title th:text="${site.title}"></title>
  
    <script type="module" crossorigin src="/themes/theme-earth/assets/index-D3NOHCZJ.js"></script>
    <link rel="modulepreload" crossorigin href="/themes/theme-earth/assets/vendor~archives~author~categories~category~doc-catalog~doc~docs~index~links~moment~moments~~ky3hjxy1-O291mca5.js">
    <link rel="modulepreload" crossorigin href="/themes/theme-earth/assets/main-CLmdnUTa.js">
    <link rel="stylesheet" crossorigin href="/themes/theme-earth/assets/vendor~archives~author~categories~category~doc-catalog~doc~docs~index~links~moment~moments~~ky3hjxy1-Wb1VPa9d.css">
    <link rel="stylesheet" crossorigin href="/themes/theme-earth/assets/main-BaWd_1hx.css">
  </head>
  <body class="hidden bg-slate-50 dark:bg-slate-900">
    <header
  id="header-menu"
  class="sticky top-0 z-10 flex h-16 bg-white py-3 shadow-sm transition-all dark:bg-gray-800"
  x-data="{ open : false }"
  th:with="menu = ${menuFinder.getPrimary()}"
>
  <div class="mx-auto flex h-full w-full max-w-7xl justify-between px-4 lg:px-6">
    <div class="flex h-full items-center gap-6">
      <div class="mr-2 h-full">
        <a href="/" class="inline-flex h-full items-center">
          <img
            th:if="${theme.config.global.logo_type == 'image'} and ${not #strings.isEmpty(site.logo)}"
            th:src="${site.logo}"
            th:alt="Logo"
            class="h-full w-auto"
          />
          <span
            th:if="${theme.config.global.logo_type == 'text'} or ${#strings.isEmpty(site.logo)}"
            id="site-title"
            class="text-lg font-medium text-gray-900 dark:text-slate-100"
            th:text="${site.title}"
          ></span>
        </a>
      </div>
      <ul id="header-filters" class="hidden items-center gap-2 sm:flex" x-data="categoryFilter">
        <li>
          <a
            href="/"
            data-filter="all"
            @click.prevent="filterByCategory('all', $event)"
            class="inline-flex h-9 cursor-pointer items-center rounded px-3 font-medium text-gray-500 transition-all hover:bg-gray-100 hover:text-gray-900 hover:shadow-sm dark:text-slate-200 dark:hover:bg-slate-700 dark:hover:text-slate-50"
          >
            <span class="truncate text-base" th:text="#{common.all}"> </span>
          </a>
        </li>
        <th:block th:with="categories = ${categoryFinder.listAsTree()}">
          <li
            x-data="dropdown"
            @mouseenter="open()"
            @mouseleave="close()"
            class="relative cursor-pointer transition-all"
            th:each="categoryItem,categoryStat : ${categories}"
            th:if="${categoryItem.spec.displayName != '默认分类'}"
          >
            <div
              class="group inline-flex h-9 cursor-pointer items-center gap-1 overflow-hidden rounded font-medium text-gray-500 transition-all hover:bg-gray-100 hover:text-gray-900 hover:shadow-sm dark:text-slate-200 dark:hover:bg-slate-700 dark:hover:text-slate-50"
            >
              <a
                class="truncate px-3 text-base"
                th:href="@{${categoryItem.status.permalink}}"
                th:attr="data-filter=${categoryItem.metadata.name}"
                @click.prevent="filterByCategory($event.currentTarget.dataset.filter, $event)"
                th:text="${categoryItem.spec.displayName}"
                th:classappend="${#lists.isEmpty(categoryItem.children) ? '' : '!pr-1'}"
              >
              </a>
              <button
                th:if="${not #lists.isEmpty(categoryItem.children)}"
                @click="open()"
                class="h-full px-2 text-lg group-hover:bg-gray-200 dark:group-hover:bg-slate-600"
              >
                <span
                  class="i-tabler-chevron-right block transition-all duration-300"
                  x-bind:class="show ? 'rotate-90' : ''"
                ></span>
              </button>
            </div>
            <ul
              th:if="${not #lists.isEmpty(categoryItem.children)}"
              @mouseenter="open()"
              @mouseleave="close()"
              x-show="show"
              x-cloak
              x-transition:enter="transition ease-out duration-100"
              x-transition:enter-start="transform opacity-0 scale-95"
              x-transition:enter-end="transform opacity-100 scale-100"
              x-transition:leave="transition ease-in duration-75"
              x-transition:leave-start="transform opacity-100 scale-100"
              x-transition:leave-end="transform opacity-0 scale-95"
              class="absolute left-0 z-10 mt-2 w-60 overflow-hidden rounded bg-white p-2 shadow dark:bg-slate-800"
            >
              <li th:replace="~{modules/category-tree :: single(categories=${categoryItem.children})}" />
            </ul>
          </li>
        </th:block>
      </ul>
    </div>
    <div class="flex items-center">
      <ul x-data="colorSchemeSwitcher" class="flex items-center gap-4">
        <li class="sm:hidden" x-on:click="open = true">
          <div class="i-tabler-menu-2 text-lg text-gray-600 hover:text-blue-600 dark:text-slate-100"></div>
        </li>
        <li
          th:if="${theme.config.style.enable_change_color_scheme}"
          x-data="dropdown"
          class="relative cursor-pointer transition-all"
          @mouseenter="open()"
          @mouseleave="close()"
        >
          <div
            class="cursor-pointer text-lg text-gray-600 transition-all hover:text-blue-600 dark:text-slate-100"
            :class="colorScheme.icon"
          ></div>
          <ul
            @mouseenter="open()"
            @mouseleave="close()"
            x-show="show"
            x-cloak
            x-transition:enter="transition ease-out duration-100"
            x-transition:enter-start="transform opacity-0 scale-95"
            x-transition:enter-end="transform opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-75"
            x-transition:leave-start="transform opacity-100 scale-100"
            x-transition:leave-end="transform opacity-0 scale-95"
            class="absolute right-0 z-10 mt-2 w-40 divide-y divide-gray-50 overflow-hidden rounded bg-white shadow dark:divide-slate-600 dark:bg-slate-700"
          >
            <template x-for="colorScheme in colorSchemes">
              <li
                class="flex w-full items-center gap-2 px-4 py-2 text-sm text-gray-600 hover:bg-gray-50 hover:text-blue-600 dark:text-slate-50 dark:hover:bg-slate-600 dark:hover:text-gray-300"
                @click="setColorScheme(colorScheme.value,true)"
              >
                <span :class="colorScheme.icon"></span>
                <span x-text="colorScheme.label"></span>
              </li>
            </template>
          </ul>
        </li>
        <!-- https://github.com/halo-sigs/plugin-search-widget -->
        <li th:if="${pluginFinder.available('PluginSearchWidget')}">
          <a
            href="javascript:SearchWidget.open()"
            th:title="#{fragment.header.search}"
            class="text-gray-600 hover:text-blue-600 dark:text-slate-100"
          >
            <div class="i-tabler-search text-lg"></div>
          </a>
        </li>
        <li
          x-data="dropdown"
          class="relative cursor-pointer transition-all"
          th:with="currentUser = ${contributorFinder.getContributor(#authentication.name)}"
          @mouseenter="open()"
          @mouseleave="close()"
        >
          <div>
            <div class="size-5 text-gray-600 hover:text-blue-600 dark:text-slate-100">
              <img
                class="size-5 rounded-full"
                th:src="${currentUser.avatar ?: #theme.assets('/images/default-avatar.svg')}"
                th:alt="${currentUser.displayName}"
              />
            </div>
            <ul
              @mouseenter="open()"
              @mouseleave="close()"
              x-show="show"
              x-cloak
              x-transition:enter="transition ease-out duration-100"
              x-transition:enter-start="transform opacity-0 scale-95"
              x-transition:enter-end="transform opacity-100 scale-100"
              x-transition:leave="transition ease-in duration-75"
              x-transition:leave-start="transform opacity-100 scale-100"
              x-transition:leave-end="transform opacity-0 scale-95"
              class="absolute right-0 z-10 mt-2 w-40 divide-y divide-gray-50 overflow-hidden rounded bg-white shadow dark:divide-slate-600 dark:bg-slate-700"
            >
              <li
                sec:authorize="isAuthenticated()"
                class="flex w-full items-center text-left text-sm hover:bg-gray-50 dark:hover:bg-slate-600"
              >
                <a
                  class="size-full truncate px-4 py-2 text-gray-600 hover:text-blue-600 dark:text-slate-50 dark:hover:text-gray-300"
                  href="/console"
                  target="_blank"
                  th:text="#{fragment.header.console}"
                >
                </a>
              </li>
              <li
                sec:authorize="isAuthenticated()"
                class="flex w-full items-center text-left text-sm hover:bg-gray-50 dark:hover:bg-slate-600"
              >
                <a
                  class="size-full truncate px-4 py-2 text-gray-600 hover:text-blue-600 dark:text-slate-50 dark:hover:text-gray-300"
                  href="/logout"
                  th:text="#{fragment.header.logout}"
                >
                </a>
              </li>
              <li
                sec:authorize="isAnonymous()"
                class="flex w-full items-center text-left text-sm hover:bg-gray-50 dark:hover:bg-slate-600"
              >
                <a
                  class="size-full truncate px-4 py-2 text-gray-600 hover:text-blue-600 dark:text-slate-50 dark:hover:text-gray-300"
                  href="/login"
                  onclick="this.href = '/login?redirect_uri=' + encodeURIComponent(window.location.href)"
                  th:text="#{fragment.header.login}"
                >
                </a>
              </li>
            </ul>
          </div>
        </li>
      </ul>
    </div>
  </div>
  <div th:if="${menu != null} and ${not #lists.isEmpty(menu.menuItems)}">
    <div
      class="fixed inset-0 z-50 bg-gray-800/40 opacity-100 backdrop-blur-sm dark:bg-black/80"
      aria-hidden="true"
      x-show="open"
      x-cloak
      x-transition:enter="ease-in-out duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="ease-in-out duration-300"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
    ></div>
    <div
      class="fixed inset-x-4 top-8 z-50 origin-top scale-100 rounded-lg bg-white p-4 dark:bg-slate-900"
      tabindex="-1"
      x-show="open"
      x-cloak
      x-transition:enter="ease-out duration-200"
      x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
      x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave="ease-in duration-100"
      x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
      @click.outside="open = false"
    >
      <div class="flex flex-row-reverse items-center justify-between">
        <button
          class="i-tabler-x p-1 text-xl text-gray-600 dark:text-slate-300"
          type="button"
          tabindex="0"
          @click="open = false"
        ></button>
        <h2 class="text-sm font-medium text-gray-600 dark:text-slate-300" th:text="#{fragment.header.menu}"></h2>
      </div>
      <nav class="mt-6" x-data="categoryFilter">
        <ul class="-my-2 divide-y divide-gray-100 text-sm text-gray-800 dark:divide-slate-800 dark:text-slate-100">
          <li>
            <a
              class="flex items-center justify-between gap-1 py-2"
              href="/"
              data-filter="all"
              @click.prevent="filterByCategory('all', $event); open = false"
            >
              <span th:text="#{common.all}"></span>
            </a>
          </li>
          <th:block th:with="categories = ${categoryFinder.listAsTree()}">
            <li th:each="categoryItem,categoryStat : ${categories}" th:if="${categoryItem.spec.displayName != '默认分类'}">
              <a
                class="flex items-center justify-between gap-1 py-2"
                th:href="@{${categoryItem.status.permalink}}"
                th:attr="data-filter=${categoryItem.metadata.name}"
                @click.prevent="filterByCategory($event.currentTarget.dataset.filter, $event); open = false"
              >
                <span th:text="${categoryItem.spec.displayName}"></span>
              </a>
              <ul class="divide-y divide-gray-100 dark:divide-slate-800" th:if="${not #lists.isEmpty(categoryItem.children)}">
                <li th:each="childMenuItem : ${categoryItem.children}" class="flex w-full items-center text-left text-sm">
                  <a
                    class="size-full truncate px-4 py-2 text-gray-600 dark:text-slate-200"
                    th:href="@{${childMenuItem.status.permalink}}"
                    th:text="${childMenuItem.spec.displayName}"
                    th:target="${childMenuItem.spec.target?.value}"
                  ></a>
                </li>
              </ul>
            </li>
          </th:block>
        </ul>
      </nav>
    </div>
  </div>
</header>


    
    <th:block th:replace="~{modules/hero :: hero(isHome = true, cover = null, title = null)}" />
  

    
  
  

  <section
    x-data="categoryFilter"
    class="mx-auto mt-6 grid max-w-7xl grid-cols-1 gap-6 px-4 md:grid-cols-[1fr_18rem] lg:px-6"
  >
    <div class="z-0 min-w-0">
      <div
        id="post-list"
        th:if="${posts.total gt 0}"
        th:with="postItems=${posts.items},list_layout=${theme.config.layout.post_list_layout}"
        class="mt-6 grid grid-cols-1 gap-4 sm:gap-5"
        th:classappend="|${list_layout == 'grid_3' ? 'sm:grid-cols-2 lg:grid-cols-3' : ''} ${list_layout == 'grid_2' ? 'sm:grid-cols-2' : ''}|"
      >
        <th:block th:each="post : ${postItems}">
          <th:block
            th:replace="~{modules/post-card :: post-card(${post},true,true,true,${list_layout == 'single' ? 'column' : 'row'})}"
          />
        </th:block>
      </div>

      <div id="post-empty" th:if="${posts.total == 0}" class="mt-6 flex items-center justify-center" style="display:none;">
        <span class="text-sm font-light text-gray-600" th:text="#{common.noPosts}"></span>
      </div>

      <th:block
        th:replace="~{modules/pagination :: pagination(context = '/', prevUrl = ${posts.prevUrl}, nextUrl = ${posts.nextUrl}, totalPages = ${posts.totalPages}, page = ${posts.page}, hasPrevious = ${posts.hasPrevious()}, hasNext = ${posts.hasNext()})}"
      />
    </div>
    <th:block th:replace="~{modules/sidebar :: sidebar(prepend = null)}" />
  </section>


    <footer th:if="${theme.config.footer.style == 'style_1'}" class="mt-10 bg-white py-8 dark:bg-slate-800">
  <div class="mx-auto max-w-7xl px-4 sm:flex sm:items-center sm:justify-between lg:px-6">
    <a href="/" class="mb-4 flex items-center justify-center sm:mb-0 sm:justify-start">
      <img
        th:if="${not #strings.isEmpty(theme.config.footer.logo)} or ${not #strings.isEmpty(site.logo)}"
        th:src="${theme.config.footer.logo ?: site.logo}"
        class="mr-3 size-8"
        th:alt="${site.title}"
      />
      <span
        class="self-center whitespace-nowrap text-2xl font-semibold dark:text-slate-50"
        th:text="${theme.config.footer.title ?: site.title}"
      >
      </span>
    </a>
    <th:block th:unless="${#strings.isEmpty(theme.config.footer.right_menu)}">
      <ul
        th:with="menu = ${menuFinder.getByName(theme.config.footer.right_menu)}"
        class="mb-6 flex flex-wrap items-center justify-center space-x-4 text-sm text-gray-500 dark:text-slate-200 sm:mb-0 sm:justify-start md:space-x-6"
      >
        <li th:each="menuItem : ${menu.menuItems}">
          <a
            th:href="@{${menuItem.status.href}}"
            class="transition-all hover:text-gray-900 hover:underline dark:hover:text-white"
            th:text="${menuItem.status.displayName}"
            th:target="${menuItem.spec.target?.value}"
          ></a>
        </li>
      </ul>
    </th:block>

    <th:block th:replace="~{modules/footer-social}" />
  </div>
  <hr class="my-6 border-gray-100 dark:border-slate-700 sm:mx-auto lg:my-8" />
  <div class="space-y-1">
    <span
      class="mx-auto block max-w-7xl px-4 text-center text-sm text-gray-500 dark:text-slate-300 lg:px-6"
      th:if="${not #strings.isEmpty(theme.config.beian.icp_text)}"
    >
      <a
        href="https://beian.miit.gov.cn/"
        class="hover:underline"

      ></a>
    </span>
    <div
      th:if="${not #strings.isEmpty(theme.config.beian.gongan_text)}"
      class="mx-auto block max-w-7xl px-4 text-center text-sm text-gray-500 dark:text-slate-300 lg:px-6"
    >
      <p class="flex items-center justify-center gap-1">
        <img th:src="@{/assets/images/gongan_beian.png}" class="size-4" alt="gongan_beian" />
        <a
          href="https://beian.mps.gov.cn/#/query/webSearch"
          class="hover:underline"
          target="_blank"
          th:href="${theme.config.beian.gongan_link}"
          th:text="${theme.config.beian.gongan_text}"
        ></a>
      </p>
    </div>
    <span class="mx-auto block max-w-7xl px-4 text-center text-sm text-gray-500 dark:text-slate-300 lg:px-6">
      ©
      <th:block th:text="${#dates.format(new java.util.Date().getTime(), 'yyyy')}" />
      <a href="/" class="hover:underline" th:text="${site.title}"></a> 版权所有，保留所有权利。
    </span>
    <span class="mx-auto block max-w-7xl px-4 text-center text-sm text-gray-500 dark:text-slate-300 lg:px-6">
      <halo:footer />
    </span>
  </div>
</footer>

  <div class="mx-auto max-w-7xl px-4 md:flex md:justify-between md:gap-10 lg:px-6">
    <div class="mb-6 max-w-full md:mb-0 md:max-w-md">
      <a href="/" class="mb-6 flex items-center">
        <img
          th:if="${not #strings.isEmpty(theme.config.footer.logo)} or ${not #strings.isEmpty(site.logo)}"

          th:alt="${site.title}"
        />

      <span

      >
      </span>

    <div

    >
      <th:block th:each="name : ${theme.config.footer.menu_names}">

              <a

              ></a>
            </li>
          </ul>

  <hr class="my-6 border-gray-200 dark:border-slate-700 sm:mx-auto lg:my-8" />
  <div class="mx-auto flex max-w-7xl flex-col px-4 sm:flex-row sm:items-center sm:justify-between lg:px-6">
    <div class="flex flex-col space-y-1 text-center sm:text-left">
      <span class="text-sm text-gray-500 dark:text-slate-300 sm:text-center">
        ©
        <th:block th:text="${#dates.format(new java.util.Date().getTime(), 'yyyy')}" />
        <a href="/" class="hover:underline" th:text="${site.title}"></a> 版权所有，保留所有权利。
      </span>

      <div class="flex flex-col gap-1 sm:flex-row">
        <span
          class="block text-center text-sm text-gray-500 sm:text-left"
          th:if="${not #strings.isEmpty(theme.config.beian.icp_text)}"
        >
          <a
            href="https://beian.miit.gov.cn/"
            class="hover:underline"
            target="_blank"
            th:href="${theme.config.beian.icp_link}"
            th:text="${theme.config.beian.icp_text}"
          ></a>
        </span>
        <div
          th:if="${not #strings.isEmpty(theme.config.beian.gongan_text)}"
          class="inline-flex items-center justify-center gap-1 text-sm text-gray-500 sm:justify-start"
        >
          <img th:src="@{/assets/images/gongan_beian.png}" class="size-4" alt="gongan_beian" />
          <a
            href="https://beian.mps.gov.cn/#/query/webSearch"
            class="hover:underline"
            target="_blank"
            th:href="${theme.config.beian.gongan_link}"
            th:text="${theme.config.beian.gongan_text}"
          ></a>
        </div>
      </div>

      <p class="text-sm text-gray-500 dark:text-slate-300">
        <halo:footer />
      </p>
    </div>

    <th:block th:replace="~{modules/footer-social}" />
  </div>
</footer>


    <button
      th:if="${theme.config.global.show_scroll_button}"
      type="button"
      id="btn-scroll-to-top"
      th:aria-label="#{fragment.layout.toTop}"
      class="fixed bottom-5 right-5 flex items-center justify-center rounded-full bg-white p-3 opacity-0 shadow transition-all duration-300 hover:opacity-70 hover:shadow-lg dark:bg-slate-600 lg:bottom-10 lg:right-10"
    >
      <span class="i-tabler-chevron-up text-2xl text-gray-600 dark:text-slate-200"></span>
    </button>

    <script th:inline="javascript">
      // 分类/标签切换：局部刷新作品列表，阻止默认整页跳转，保持滚动位置不变。
      document.addEventListener('alpine:init', () => {
        Alpine.data('categoryFilter', () => ({
          loading: false,
          init() {
            /* 支持 /#cat=<分类名> 直达：从详情页返回时恢复筛选状态 */
            const matched = /^#cat=([^&]+)$/.exec(window.location.hash || '');
            if (!matched) return;
            const name = decodeURIComponent(matched[1]);
            if (name && name !== 'all') this.filterByCategory(name);
          },
          async filterByCategory(name, event) {
            if (this.loading) return;
            this.loading = true;
            const list = document.getElementById('post-list');
            const empty = document.getElementById('post-empty');
            try {
              let url;
              if (name && name !== 'all') {
                url = '/apis/api.content.halo.run/v1alpha1/categories/' + encodeURIComponent(name) + '/posts?size=24';
              } else {
                url = '/apis/api.content.halo.run/v1alpha1/posts?size=24';
              }
              const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
              if (!resp.ok) throw new Error('HTTP ' + resp.status);
              const data = await resp.json();
              const items = data.items || [];
              list.innerHTML = items.map(p => this.renderCard(p)).join('');
              if (empty) empty.style.display = items.length ? 'none' : 'flex';
              list.style.display = items.length ? '' : 'none';
              /* 把筛选状态写进地址栏，便于刷新与「返回」时还原 */
              if (window.history && window.history.replaceState) {
                const target = name && name !== 'all'
                  ? window.location.pathname + window.location.search + '#cat=' + encodeURIComponent(name)
                  : window.location.pathname + window.location.search;
                window.history.replaceState(null, '', target);
              }
            } catch (err) {
              console.error('分类切换失败', err);
            } finally {
              this.loading = false;
            }
          },
          renderCard(p) {
            const spec = p.spec || {};
            const permalink = (p.status && p.status.permalink) || '/archives/' + (spec.slug || '');
            const name = (p.metadata && p.metadata.name) || '';
            const cover = spec.cover || '';
            const title = this.esc(spec.title || '');
            const excerpt = this.esc((p.status && p.status.excerpt) || (spec.excerpt && spec.excerpt.raw) || '');
            const cat = (p.categories && p.categories[0]) || null;
            const catName = cat ? this.esc(cat.spec.displayName) : '';
            const catLink = cat && cat.status ? cat.status.permalink : '';
            const owner = p.owner || {};
            const avatar = owner.avatar || '/themes/theme-earth/assets/images/default-avatar.svg';
            const ownerName = this.esc(owner.displayName || '');
            const pub = spec.publishTime ? spec.publishTime.slice(0, 10) : '';
            const tags = (p.tags || []).map(t => {
              const n = this.esc(t.spec.displayName);
              const l = t.status ? t.status.permalink : '';
              return '<a href="' + this.esc(l) + '" title="' + n + '" class="cursor-pointer text-sm italic text-gray-600 hover:text-gray-900 dark:text-slate-400 dark:hover:text-slate-500">#' + n + '</a>';
            }).join('');
            const coverHtml = cover
              ? '<div class="aspect-h-2 aspect-w-3" data-am-cover-wrap="true"><a href="' + this.esc(permalink) + '" title="' + title + '"><img src="' + this.esc(cover) + '" alt="' + title + '" data-am-cover="' + this.esc(cover) + '" class="size-full object-cover transition-all duration-500 group-hover:scale-105" /></a></div>'
              : '';
            const mgmt = '<div class="am-mgmt" style="margin-left:auto;align-items:center;gap:.35rem">' +
              '<button type="button" class="am-btn am-btn-edit" data-am-action="edit" data-am-name="' + this.esc(name) + '" data-am-title="' + title + '" data-am-excerpt="' + excerpt + '" data-am-cover="' + this.esc(cover) + '" title="编辑《' + title + '》"><span style="font-size:.8rem">✎</span>编辑</button>' +
              '<button type="button" class="am-btn am-btn-del" data-am-action="delete" data-am-name="' + this.esc(name) + '" data-am-title="' + title + '" title="删除《' + title + '》"><span style="font-size:.8rem">🗑</span>删除</button>' +
              '</div>';
            return (
              '<div class="group flex flex-col overflow-hidden rounded-xl bg-white shadow-md ring-black transition-all duration-500 hover:shadow-lg hover:-translate-y-1 hover:ring-2 dark:bg-slate-800 dark:ring-slate-700" data-am-name="' + this.esc(name) + '">' +
                coverHtml +
                '<div class="relative grid h-full grid-cols-1 content-between gap-2 p-4">' +
                  '<div class="space-y-2">' +
                    '<div class="flex flex-wrap items-center gap-2">' +
                      (catName ? '<a href="' + this.esc(catLink) + '" title="' + catName + '" class="mr-1 text-sm font-medium text-gray-800 hover:text-gray-900 dark:text-slate-500 dark:hover:text-slate-600">' + catName + '</a>' : '') +
                      tags +
                    '</div>' +
                    '<h1 class="line-clamp-2 cursor-pointer text-lg font-medium transition-all hover:text-gray-500 hover:underline dark:text-slate-50 dark:hover:text-white sm:line-clamp-4"><a href="' + this.esc(permalink) + '" title="' + title + '" data-am-title="' + title + '">' + title + '</a></h1>' +
                    '<div style="margin-top:.15rem"><a href="' + this.esc(permalink) + '" title="查看《' + title + '》完整内容（新窗口打开）" target="_blank" rel="noopener noreferrer" class="post-detail-link" style="display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .7rem;border:1px solid #cbd9ec;border-radius:999px;background:#f3f7fd;color:#17457e;font-size:.8125rem;font-weight:600;line-height:1.6;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s,border-color .2s" target="_blank" rel="noopener noreferrer">查看项目详情<span aria-hidden="true" style="font-size:.95rem;line-height:1">›</span></a></div>' +
                    '<p class="font-sm line-clamp-2 font-light dark:text-slate-200 sm:line-clamp-3"><a href="' + this.esc(permalink) + '" title="' + title + '" data-am-excerpt="' + excerpt + '" class="cursor-pointer hover:text-gray-600 dark:hover:text-white" style="text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:rgba(107,114,128,.7);transition:color .2s,text-decoration-color .2s" target="_blank" rel="noopener noreferrer">' + excerpt + '</a></p>' +
                  '</div>' +
                  '<div class="mt-4 flex items-center justify-start gap-2">' +
                    '<a href="' + this.esc(owner.permalink || '') + '" title="' + ownerName + '"><img src="' + this.esc(avatar) + '" alt="' + ownerName + '" class="size-8 rounded-full border drop-shadow-sm dark:border-slate-700" /></a>' +
                    '<span class="text-sm tabular-nums text-gray-600 dark:text-slate-300">' + pub + '</span>' +
                    mgmt +
                  '</div>' +
                '</div>' +
              '</div>'
            );
          },
          esc(s) {
            return String(s == null ? '' : s)
              .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
          }
        }));
      });
    </script>

    <th:block th:replace="~{modules/achievement-manage :: achievement-manage}" />
  </body>
</html>
